# Build, test and lint on every push and pull request.
#
# Two runners, because a suite that names a platform is only ever run by that
# platform, and a `cfg` that excludes one is invisible from the other — it does
# not fail there, it is not compiled there, and the run is green having said
# nothing. Three shapes of test exist here and only the first is covered by one
# runner:
#
#   - shared, the large majority: parsing, layout, wrapping, markdown, scroll
#     arithmetic, key encoding, and every pty test in `abeam-pty/tests/session.rs`
#   - twinned, `#[cfg(all(test, windows))]` beside `#[cfg(all(test, unix))]`:
#     `launch`, the shell pane, and everything else that spawns a real child or
#     asks what a program name means on this platform
#   - Windows-only for ever: `abeam-pty/tests/conpty.rs`, which pins ConPTY's
#     opening `ESC [ 6 n` handshake — there is nothing on the other side to twin
#     it with, and there never will be
#
# Which is why this file was a single Windows job for as long as the Unix half
# did not exist: a green tick from Linux would have meant the twinned half was
# compiled out and the rest was passing by default. There is something on the
# other side now, and one runner would leave it unrun. See the README.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one platform is immediately a question about the other,
      # and the default would cancel the answer to save a few runner-minutes.
      # Both legs run to the end so that one push reports on both.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Edition 2024 needs 1.85+; the code assumes let-chains, which are 1.88+.
      # `stable` is well past both, and pinning here would only mean forgetting
      # to unpin.
      #
      # It does mean clippy here can be newer than clippy on your machine, and a
      # new stable can fail this job on a push that changed nothing relevant —
      # that is the cost of `-D warnings`, and it is worth it. When it happens,
      # `rustup toolchain install <version>` and `cargo +<version> clippy` will
      # reproduce it locally without disturbing your default toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Nothing to configure for the matrix: the cache key already carries the
      # runner and the toolchain, so the two legs fill separate caches instead
      # of overwriting each other with objects the other platform cannot link.
      - uses: Swatinem/rust-cache@v2

      # `--all-targets` throughout, or the examples bit-rot: `host.rs` is the
      # manual pty regression harness and is not built by a plain `cargo test`.
      - run: cargo build --workspace --all-targets

      # Includes tests/end_to_end.rs, which spawns the built binary inside a
      # real pty and types at it — ConPTY on one leg, a Unix pty on the other.
      # If either behaves differently on a GitHub runner than on a desktop,
      # this is where that shows up.
      - run: cargo test --workspace

      # On both legs for the same reason the tests are: clippy only sees the
      # code its target compiles, so a lint sitting in the `cfg(unix)` half is
      # invisible from Windows and one in the `cfg(windows)` half is invisible
      # from Linux. `-D warnings` is a gate only where something looked.
      - run: cargo clippy --workspace --all-targets -- -D warnings
