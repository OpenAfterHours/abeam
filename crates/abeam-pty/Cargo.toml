[package]
name = "abeam-pty"
description = "Host a child process in a pty and render it, correctly, on Windows ConPTY."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
portable-pty.workspace = true
thiserror.workspace = true
vt100.workspace = true

# Job objects, for `src/job.rs`: a killed shell has to take its `cargo build`
# with it. Not a new crate in the tree — portable-pty already depends on winapi
# 0.3 and enables six of its modules; this asks for three more, so what changes
# is how much of winapi compiles, not what is compiled.
[target."cfg(windows)".dependencies.winapi]
version = "0.3"
features = ["handleapi", "jobapi2", "winnt"]

# examples/host.rs only. The library itself stays renderer-agnostic so that a
# consumer using something other than ratatui pays nothing for the demo.
[dev-dependencies]
ratatui.workspace = true
tui-term.workspace = true
