[package]
name = "abeam"
description = "A terminal multiplexer for an AI coding workflow on Windows and Linux: the agent in one pane, git, files and a shell in the other. Hosts Claude Code and GitHub Copilot CLI."
# Five is crates.io's limit, so this is a choice rather than a list: what abeam
# is, what it is built on, and the two agents somebody would search for by name.
# `pty` holds the middle slot that `conpty` used to, now that ConPTY is one of
# two backends rather than the whole story: nobody looking for this from Linux
# would type the Windows name, and five slots leave no room to carry both.
keywords = ["terminal", "tui", "pty", "claude-code", "copilot"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
abeam-pty.workspace = true
ratatui.workspace = true
tui-term.workspace = true

# --- the right-hand panes ------------------------------------------------
# The file watcher is abeam's whole reason to exist, so it is not optional:
# debounce it, because one save from an editor fires several events.
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# gitignore-aware walking. A file list that includes `target/` is useless.
ignore = "0.4.31"

# Markdown. `tui-markdown` was here as the quick path and is gone: it renders
# to a `Text` and defers wrapping to the widget, and the viewer scrolls by
# physical row, so it could not indent a continuation under its own bullet or
# keep a quote gutter unbroken. The pane drives the parser directly instead.
pulldown-cmark = "0.13.4"

# Syntax highlighting. `default-fancy` swaps oniguruma for fancy-regex, which
# keeps the build pure Rust — no C toolchain, no oniguruma build step.
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

# Column-correct text. A terminal pane measures in cells, not chars: CJK and
# emoji are two cells wide and `str::len` will lie to you about both.
unicode-width = "0.2.2"

# --- reading the agent's own state ---------------------------------------
# Claude writes a small JSON record per live session and answers
# `claude agents --json` with an array of them; both are formats abeam does
# not own. This is the one place the git pane's "shell out and parse it
# yourself" precedent does not carry: `git status --porcelain=v2` is
# line-oriented and frozen, whereas JSON has string and unicode escapes and
# can grow a nested field at any version bump. A hand-rolled scanner would
# put a silent mis-parse directly on the path that decides whether a queued
# prompt is safe to send — which is the one thing this feature must never
# get wrong.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Also deliberately absent, having been tried and not needed: `textwrap` (the
# viewer wraps with a first-line and a continuation prefix, which is the whole
# point of its wrapper and not something a general one does), `similar` (there
# is no diff view yet — the git pane shows status and per-file line counts) and
# `chrono` (commit ages are unix timestamps subtracted from `now`, which needs
# no calendar). Put any of them back when something actually calls for it.
#
# Deliberately absent from the start: any git library. The git pane shells out
# to `git`, which already knows this user's config, credentials and worktree
# layout. `git status --porcelain=v2` and `git log --format=...` are trivial to
# parse and cost nothing to build.

# `setsid`, for the `pre_exec` in `src/dispatch.rs`, and `getpgrp` for the test
# that pins it. `std` offers `process_group(0)` for nothing and it is the weaker
# call: it leaves a dispatched task holding abeam's controlling terminal as a
# background process group, where a read from `/dev/tty` stops it with `SIGTTIN`
# and hangs the worker thread waiting on its pipes. Not a new crate in the tree —
# `abeam-pty` already declares libc for `cfg(unix)` and portable-pty depends on
# it unconditionally, and libc has no features to ask for, so this changes
# nothing about what is fetched or compiled. It is here so that a crate calling
# libc says so in its own manifest.
[target."cfg(unix)".dependencies]
libc = "0.2"
