[workspace]
members = ["crates/forge", "crates/forge-pty"]
# A virtual manifest has no edition to infer a resolver from, so an unset
# resolver silently means resolver 1 plus a warning as soon as a member is
# edition 2021+. 3 is what edition-2024 members get anyway.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
forge-pty = { path = "crates/forge-pty" }

# --- shared across the crate boundary -----------------------------------
# These three carry *types* between forge and forge-pty. A version skew in any
# of them is not a dependency problem, it is a type error that reads like a
# compiler bug ("expected Screen, found Screen"). One declaration each, here.
#   crossterm  - forge builds KeyEvent/MouseEvent, forge-pty consumes them
#   vt100      - forge-pty produces Screen, tui-term renders it
#   tui-term   - must agree with vt100 above; bumping it means checking vt100
crossterm = "0.29.0"
vt100 = "0.16.2"
tui-term = "0.3.4"

portable-pty = "0.9.0"
ratatui = "0.30.2"
anyhow = "1.0.104"
thiserror = "2.0"
